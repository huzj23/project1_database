version: 1
scenario: constant_force

# ===========================================================================
# 运动 #2 匀加速（恒定外力 F = m*a）
#
# Zero new code: reuses the mentor's `constant_force` scenario unchanged.
# Our own map + our own GSO objects only.
#
# The scenario converts a target displacement into a force magnitude F = m*a and
# applies it through the solver every substep (add_persistent_force ->
# applyExternalForce).  Bullet integrates the resulting acceleration; no frame is
# prescribed.
#
# Actor choice: NO plush elephant.  A plush toy is a soft body and we have no
# soft-body adaptation, so it must not appear in a driven-contact motion where
# the deformation would be the visible point.  Firm containers only.
# ===========================================================================

controlled_variants:
  variable: constant_force
  multipliers: [1.0, 0.5, 1.5]
  labels: [x1, x0.5, x1.5]

selection:
  map_ids: [replicad_apartment]
  asset_ids:
    - gso_room_essentials_fabric_cube_lavender
    - gso_whey_protein_vanilla
    - gso_ecoforms_plant_container_gp16a_coral

timing:
  duration_seconds: 5.0625
  frame_count: 81
  physics_fps: 240
  video_fps: 16

physics:
  gravity: [0.0, 0.0, -9.81]
  rolling_friction: 0.0
  spinning_friction: 0.0
  # Same surface reasoning as rolling: F = m*a on a 1.5 g body is ~3e-5 N, which
  # a mu of 0.36 blocks outright.  On a polished floor (mu 0.06) the applied
  # force produces the intended acceleration and the solver integrates it.
  # Frictionless support so the applied force F = m*a is not opposed by contact
  # friction.  Same reasoning and same measurement as rolling_gso.yaml.
  friction_range: [0.0, 0.0]
  restitution_range: [0.05, 0.20]
  # Both displacement contributions are expressed relative to object size so the
  # longer 81-frame clip stays visible for objects of different dimensions.
  initial_travel_object_extent_range: [0.8, 1.5]
  acceleration_travel_object_extent_range: [1.5, 3.0]
  direction_degrees_range: [-10.0, 10.0]

surface:
  allowed_types: [floor]
  edge_margin: 0.10

validation:
  max_sample_attempts: 200
  reject_initial_overlap: true
  min_travel_distance: 0.03
  max_linear_speed: 4.0
  max_trajectory_extent_object_ratio: 18.0
  min_force_response: 0.01
  max_acceleration_relative_std: 0.60
  require_supported: true
  require_in_map_bounds: true

camera:
  policy: trajectory_side
  relative_to_trajectory: true
  side: random
  azimuth_offset_degrees_range: [-20.0, 20.0]
  focal_length_mm: 40.0
  framing:
    sensor_width_mm: 36.0
    trajectory_frame_fraction: 0.80
    object_padding: 0.25
    min_object_frame_fraction: 0.03
    max_object_frame_fraction: 0.55
    min_object_frame_area_fraction: 0.0025
    max_object_frame_area_fraction: 0.20
    min_distance: 0.50
    max_distance: 8.00
    elevation_degrees: 10.0
    min_height_above_trajectory: 0.25
    look_at_offset: 0.0

output:
  resolution: [1920, 1080]
  modalities: [rgb, depth, segmentation]
  save_physics_trajectory: true
  save_render_trajectory: true
  save_collision_events: true
  save_config: true
  write_video: true
