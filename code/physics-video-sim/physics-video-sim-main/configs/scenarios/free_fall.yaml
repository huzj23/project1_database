version: 1
scenario: free_fall

controlled_variants:
  variable: gravity
  multipliers: [1.0, 0.5, 1.5]
  labels: [x1, x0.5, x1.5]

selection:
  map_ids: [basketball_court, classroom, street]
  asset_ids:
    - sphere_basketball
    - sphere_football
    - sphere_baseball
    - sphere_volleyball

timing:
  duration_seconds: 5.0625
  frame_count: 81
  physics_fps: 240
  video_fps: 16

physics:
  gravity: [0.0, 0.0, -9.81]
  rolling_friction: 0.0
  spinning_friction: 0.0
  horizontal_speed_range: [0.03, 0.12]
  vertical_speed_range: [-0.05, 0.05]
  angular_speed_range: [0.0, 2.0]
  direction_degrees_range: [-180.0, 180.0]
  drop_height_object_extent_range: [3.0, 6.0]
  drop_height_absolute_range: [0.45, 1.20]

surface:
  allowed_types: [floor]
  edge_margin: 0.15

validation:
  min_drop_height: 0.30
  min_drop_distance: 0.25
  max_linear_speed: 8.0
  max_trajectory_extent_object_ratio: 18.0
  max_surface_penetration: 0.04
  require_expected_collision: true
  require_bounce: true
  min_bounce_upward_speed: 0.05
  require_in_map_bounds: true

camera:
  policy: trajectory_side
  relative_to_trajectory: true
  side: random
  azimuth_offset_degrees_range: [-12.0, 12.0]
  focal_length_mm: 35.0
  framing:
    sensor_width_mm: 36.0
    trajectory_frame_fraction: 0.78
    object_padding: 0.30
    min_object_frame_fraction: 0.03
    max_object_frame_fraction: 0.30
    min_object_frame_area_fraction: 0.0025
    max_object_frame_area_fraction: 0.12
    min_distance: 0.40
    max_distance: 8.0
    elevation_degrees: 4.0
    min_height_above_trajectory: 0.15
    look_at_offset: 0.0

output:
  resolution: [1280, 720]
  modalities: [rgb, depth, segmentation]
  save_physics_trajectory: true
  save_render_trajectory: true
  save_collision_events: true
  save_config: true
  write_video: true
