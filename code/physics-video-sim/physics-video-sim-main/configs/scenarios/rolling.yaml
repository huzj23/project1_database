version: 1
scenario: rolling

controlled_variants:
  variable: initial_speed
  multipliers: [1.0, 0.5, 1.5]
  labels: [x1, x0.5, x1.5]

selection:
  # The first IDs remain the default single-sample pair. Enumeration tools use
  # the Cartesian product of every configured ID below.
  map_ids: [basketball_court, classroom, street]
  asset_ids:
    - sphere_basketball
    - sphere_football
    - sphere_baseball
    - sphere_volleyball

timing:
  duration_seconds: 5.0625
  frame_count: 81
  physics_fps: 240
  video_fps: 16

physics:
  gravity: [0.0, 0.0, -9.81]
  # No driving force and no rolling/spinning drag: Bullet integrates a
  # near-uniform pure-rolling state from the sampled initial conditions.
  rolling_friction: 0.0
  spinning_friction: 0.0
  linear_speed_range: [0.60, 0.90]
  travel_object_extent_range: [3.0, 6.0]
  direction_degrees_range: [-10.0, 10.0]
  angular_velocity_policy: pure_rolling
  external_force: [0.0, 0.0, 0.0]

surface:
  allowed_types: [floor, table_top]
  min_up_dot: 0.98
  min_available_area: [3.0, 2.0]
  min_clearance: 0.5
  edge_margin: 0.5

validation:
  max_sample_attempts: 100
  reject_initial_overlap: true
  min_travel_distance: 0.05
  min_travel_object_extent_ratio: 1.0
  max_linear_speed: 10.0
  max_trajectory_extent_object_ratio: 20.0
  max_speed_relative_change: 0.15
  require_supported: true
  require_in_map_bounds: true

camera:
  policy: trajectory_side
  relative_to_trajectory: true
  side: random
  azimuth_offset_degrees_range: [-12.0, 12.0]
  focal_length_mm: 35.0
  framing:
    sensor_width_mm: 36.0
    trajectory_frame_fraction: 0.80
    object_padding: 0.25
    min_object_frame_fraction: 0.03
    max_object_frame_fraction: 0.30
    min_object_frame_area_fraction: 0.0025
    max_object_frame_area_fraction: 0.12
    min_distance: 0.40
    max_distance: 8.0
    # Keep the side view close to horizontal. The minimum height prevents a
    # short-trajectory camera from dropping too close to the floor.
    elevation_degrees: 6.0
    min_height_above_trajectory: 0.20
    look_at_offset: 0.0

output:
  resolution: [1280, 720]
  modalities: [rgb, depth, segmentation]
  save_physics_trajectory: true
  save_render_trajectory: true
  save_collision_events: true
  save_config: true
  write_video: true
