  replicad_apartment:
    environment_asset_id: replicad_apartment
    surface_groups:
      - surface_type: floor
        object_extent_range_m: [0.03, 0.35]
        edge_margin: 0.10
        clearance: 0.4
        collision_thickness: 0.05
        regions:
          - region_id: replicad_apartment_floor_pinned
            cleanliness: verified_clear
            verification: floor_slab_extracted_from_scene_blend_by_geometry
            position: [0.6500, -2.1500, 0.0007]
            normal: [0.0, 0.0, 1.0]
            bounds_xy: [-1.9000, 3.2000, -4.0000, -0.3000]
            # Placement rectangle widened from the old 1.7 x 1.7 m pin to
            # 5.1 x 3.7 m = 18.87 m^2 of raycast-verified clear floor
            # (grid 0.10 m over the floor footprint; a point is clear when the
            # first downward hit is the floor itself, z < 0.05).  62.3% of the
            # 8500 sampled points were clear; this is the largest clear
            # rectangle found.  Collision uses the extracted floor mesh, so
            # bounds_xy now bounds PLACEMENT only.
            # The scene's own floor slab replaces the old 2.89 m^2 box proxy.
            # Extracted from visual/scene.blend keeping only faces whose ALL
            # THREE vertices lie within 1 cm of the floor plane and whose
            # normal is upward -> 94 triangles, 84.68 m^2, z in
            # [-0.0416, 0.0007].
            #
            # The first attempt filtered on the FACE CENTRE z < 0.05 and kept
            # 202 faces / 81.61 m^2, but that admitted triangles spanning a
            # height change: raycasting then hit z = 0.084 at the placement
            # point, the actor rested 7.1 cm too high, and supported_fraction
            # collapsed to 0.012.  The all-vertices criterion removes them.
            #
            # The simulator builds its support body from this mesh instead of
            # from bounds_xy.
            collision:
              type: mesh
              mesh: collision/surfaces/replicad_apartment_floor.obj
              simulation: collision/surfaces/replicad_apartment_floor.urdf
              triangles: 94
              max_triangles: 2048
              mesh_sha256: 0a3fde1f13f44d8147f35c9ffacdb9b5850ff95e9dbb7e6ac4b6d7fb6c591f28

      # ------------------------------------------------------------------
      # table_top: the flat top of frl_apartment_table_01, for the turntable
      # motions (#5 circular carry and #6 disc spin).  Measured on the current
      # scene.blend by raycast: z = 0.7584 over x[-0.20, 0.80] y[-0.20, 0.50],
      # 82 of 82 sampled points at 0.7584 with normal.z = 1.0, so it is
      # genuinely flat; it matches the frozen V3.2 record (top z 0.7584,
      # centre (0.414, 0.175)).
      #
      # The disc is r = 0.30 m and the table is about 1.0 x 0.7 m, so placement
      # is the largest 0.60 x 0.60 m square that keeps the whole disc on the
      # table.  Collision is the extracted floor mesh, not the table: the disc is
      # a dynamic body resting on its own contact with the floor mesh below, and
      # the table is scenery in the render.
      # ------------------------------------------------------------------
      - surface_type: table_top
        object_extent_range_m: [0.03, 0.20]
        edge_margin: 0.02
        clearance: 0.05
        collision_thickness: 0.05
        regions:
          - region_id: replicad_apartment_table_top
            cleanliness: verified_clear
            verification: raycast_flat_table_surface_at_z_0.7584
            position: [0.2000, 0.2000, 0.7584]
            normal: [0.0, 0.0, 1.0]
            bounds_xy: [-0.1000, 0.5000, -0.1000, 0.5000]
            collision:
              type: mesh
              mesh: collision/surfaces/replicad_apartment_floor.obj
              simulation: collision/surfaces/replicad_apartment_floor.urdf
              triangles: 94
              max_triangles: 2048
              mesh_sha256: 0a3fde1f13f44d8147f35c9ffacdb9b5850ff95e9dbb7e6ac4b6d7fb6c591f28
