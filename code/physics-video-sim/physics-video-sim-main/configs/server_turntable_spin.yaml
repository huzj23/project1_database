profile: server

# ===========================================================================
# Environment config for motion #6 (turntable_spin).  See
# server_turntable_carry.yaml for why this separate file is needed: it selects
# the turntable scenario through `project.scenario_config` so that
# configs/server.yaml never has to be touched.
# ===========================================================================

project:
  scenario_config: configs/scenarios/turntable_spin_gso.yaml
  seed: 6001

paths:
  asset_registry: configs/assets.yaml
  map_registry: configs/maps.yaml
  asset_root: assets
  output_root: datasets
  cache_root: cache
  log_root: logs
  blender_executable: /data/raw/huzijian/project1_database/tools/runtime/blender-3.4.1-linux-x64/blender
  phyco_sim_root: third_party/phyco-sim

execution:
  headless: true
  num_workers: 1
  num_samples: 1
  gpu_ids: []

render:
  samples_per_pixel: 24
  engine: CYCLES
  device: CPU
  compute_backend: NONE
  use_denoising: true
  use_adaptive_sampling: true
  adaptive_threshold: 0.01
  max_bounces: 8
  view_transform: Filmic
  look: Medium High Contrast
  exposure: 0.0
  gamma: 1.0
  save_blend: false
