# --- collision ------------------------------------------------------------
# Low-poly convex hull regenerated from the normalized visual with the
# project's own scripts/generate_collision_mesh.py at --target-faces 512.
#
# FRAME NOTE (important): the visual OBJ is authored Z-up, i.e. its file
# coordinates are already the runtime frame (verified against the rendered
# depth of datasets/turntable_carry/seed-005001).  generate_collision_mesh.py
# imports OBJ with bpy defaults (Rx(+90)) and exports with
# axis_forward="Y", axis_up="Z" (no further conversion), so its raw output for
# an OBJ input is the visual rotated +90 deg about X -- support_height 0.115146
# and a 90-deg-rotated body.  The exact inverse Rx(-90) has therefore been
# applied to the generated mesh so collision and visual share ONE frame, which
# the convention requires ("碰撞 mesh 必须 ... 保持相同原点、朝向和尺度").
# The uncorrected generator output is kept at tmp/zz_coll_final/raw_model.obj
# for comparison.  See log/V4.1_调研结果文档_碰撞体生成脚本对OBJ输入的坐标系缺陷_20260923.md
#
# bounding_radius definition change: this was 0.202186, which is the half
# AABB DIAGONAL from the original data.json bounds
# (0.5*sqrt(0.267932^2 + 0.220669^2 + 0.207446^2) = 0.202186 exactly) and is
# not a bounding radius at all.  It is now max|vertex| of the installed convex
# hull = 0.166734, the convention used by food_lime/food_apple/food_lychee and
# the mathematically correct radius for a convex body.  This is a 17.5%
# reduction in the reported figure and is a correctness fix, not a regression;
# it does not change any simulated geometry.
collision:
  type: convex_hull
  mesh: collision/model.obj
  simulation: collision/model.urdf
  mesh_sha256: bc916352bcbf71b790c1174aab06bcf8510e69b5f3a96cbe8b306062ab44ede1
  vertices: 258
  triangles: 512
  max_triangles: 512
  bounding_radius: 0.166734
  # footprint_radius is retained at the measured horizontal half-extent; it is
  # what the turntable scenario uses to check the actor fits on the 0.30 m
  # disc (orbit + footprint <= disc radius), so it must stay below the new
  # bounding_radius -- 0.133966 <= 0.166734 holds.
  footprint_radius: 0.133966
  support_height: 0.073611
  half_extents: [0.133985, 0.110288, 0.103684]

physics:
  mass_range: [0.001840, 0.002760]
  friction_range: [0.30, 0.60]
  restitution_range: [0.05, 0.35]

material_class: soft

allowed_scenarios: [rolling, turntable_carry, turntable_spin, damping]